---
- name: Validate deployment inputs
  ansible.builtin.assert:
    that:
      - forgeflow_app_image | length > 0
      - forgeflow_app_environment in ["dev", "staging", "production"]
      - not forgeflow_app_image.endswith(':latest')
      - forgeflow_app_public_port | int > 0
      - forgeflow_app_public_port | int < 65536
    fail_msg: "Provide an approved environment, explicit immutable image tag, and valid port."

- name: Ensure deployment state directory exists
  ansible.builtin.file:
    path: "{{ forgeflow_app_state_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Inspect the currently running container
  community.docker.docker_container_info:
    name: "{{ forgeflow_app_container_name }}"
  register: forgeflow_app_current_container

- name: Record current image for rollback
  ansible.builtin.copy:
    content: "{{ forgeflow_app_current_container.container.Config.Image }}\n"
    dest: "{{ forgeflow_app_state_directory }}/previous-image"
    owner: root
    group: root
    mode: "0640"
  when: forgeflow_app_current_container.exists

- name: Deploy image and verify health
  block:
    - name: Pull requested image
      community.docker.docker_image:
        name: "{{ forgeflow_app_image }}"
        source: pull

    - name: Start ForgeFlow container
      community.docker.docker_container:
        name: "{{ forgeflow_app_container_name }}"
        image: "{{ forgeflow_app_image }}"
        state: started
        restart_policy: always
        recreate: true
        pull: never
        published_ports:
          - "{{ forgeflow_app_public_port }}:{{ forgeflow_app_internal_port }}"
        env:
          forgeflow_app_environment: "{{ forgeflow_app_environment }}"
          forgeflow_app_log_level: "{{ forgeflow_app_log_level }}"
        read_only: true
        tmpfs:
          - /tmp:size=16m,mode=1777
        cap_drop:
          - ALL
        security_opts:
          - no-new-privileges:true

    - name: Wait for the deployed service to become healthy
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ forgeflow_app_public_port }}{{ forgeflow_app_health_path }}"
        status_code: 200
        return_content: true
      register: forgeflow_app_deployment_health
      retries: "{{ forgeflow_app_health_retries }}"
      delay: "{{ forgeflow_app_health_delay }}"
      until:
        - forgeflow_app_deployment_health.status == 200
        - forgeflow_app_deployment_health.json.status == "healthy"

    - name: Record successful deployment
      ansible.builtin.copy:
        content: |
          image={{ forgeflow_app_image }}
          environment={{ forgeflow_app_environment }}
          deployed_at={{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}
        dest: "{{ forgeflow_app_state_directory }}/current-deployment"
        owner: root
        group: root
        mode: "0640"

  rescue:
    - name: Restore the previous image after a failed health check
      community.docker.docker_container:
        name: "{{ forgeflow_app_container_name }}"
        image: "{{ forgeflow_app_current_container.container.Config.Image }}"
        state: started
        restart_policy: always
        recreate: true
        pull: never
        published_ports:
          - "{{ forgeflow_app_public_port }}:{{ forgeflow_app_internal_port }}"
        env:
          forgeflow_app_environment: "{{ forgeflow_app_environment }}"
          forgeflow_app_log_level: "{{ forgeflow_app_log_level }}"
        read_only: true
        tmpfs:
          - /tmp:size=16m,mode=1777
        cap_drop:
          - ALL
        security_opts:
          - no-new-privileges:true
      when: forgeflow_app_current_container.exists

    - name: Fail after automatic recovery attempt
      ansible.builtin.fail:
        msg: >-
          Deployment health validation failed. The previous container image was restored when one existed.
