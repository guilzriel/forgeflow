---
- name: Roll back ForgeFlow to the previously recorded image
  hosts: all
  gather_facts: false
  become: true
  serial: 1
  tasks:
    - name: Read previously deployed image
      ansible.builtin.slurp:
        src: "{{ forgeflow_state_directory }}/previous-image"
      register: previous_image_file

    - name: Decode previous image
      ansible.builtin.set_fact:
        rollback_image: "{{ previous_image_file.content | b64decode | trim }}"

    - name: Validate rollback image
      ansible.builtin.assert:
        that:
          - rollback_image | length > 0
          - not rollback_image.endswith(':latest')
        fail_msg: "No safe previous image is available for rollback."

    - name: Pull rollback image
      community.docker.docker_image:
        name: "{{ rollback_image }}"
        source: pull

    - name: Restore previous container image
      community.docker.docker_container:
        name: "{{ forgeflow_container_name }}"
        image: "{{ rollback_image }}"
        state: started
        restart_policy: always
        recreate: true
        pull: never
        published_ports:
          - "{{ forgeflow_public_port }}:{{ forgeflow_internal_port }}"
        env:
          FORGEFLOW_ENVIRONMENT: "{{ forgeflow_environment }}"
          FORGEFLOW_LOG_LEVEL: "{{ forgeflow_log_level }}"
        read_only: true
        tmpfs:
          - /tmp:size=16m,mode=1777
        cap_drop:
          - ALL
        security_opts:
          - no-new-privileges:true

    - name: Verify rollback health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ forgeflow_public_port }}{{ forgeflow_health_path }}"
        status_code: 200
        return_content: true
      register: rollback_health
      retries: "{{ forgeflow_health_retries }}"
      delay: "{{ forgeflow_health_delay }}"
      until:
        - rollback_health.status == 200
        - rollback_health.json.status == "healthy"
