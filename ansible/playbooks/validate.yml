---
- name: Validate ForgeFlow deployment prerequisites
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Verify supported operating system family
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family in ["Debian", "RedHat"]
        fail_msg: "This reference playbook supports Debian- and Red Hat-family Linux hosts."

    - name: Check Docker command
      ansible.builtin.command: docker version
      register: docker_version
      changed_when: false

    - name: Show validated Docker availability
      ansible.builtin.debug:
        msg: "Docker is reachable on {{ inventory_hostname }}."
