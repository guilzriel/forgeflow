---
- name: ForgeFlow PHP-FPM health check
  hosts: all
  gather_facts: false
  tasks:
    - name: Validate PHP-FPM configuration
      ansible.builtin.command:
        argv: [docker, exec, "{{ forgeflow_container }}", php-fpm, -t]
      register: fpm_config
      changed_when: false
      failed_when: false

    - name: Read PHP-FPM version
      ansible.builtin.command:
        argv: [docker, exec, "{{ forgeflow_container }}", php-fpm, -v]
      register: fpm_version
      changed_when: false
      failed_when: false

    - name: Verify PHP-FPM process
      ansible.builtin.command:
        argv: [docker, exec, "{{ forgeflow_container }}", pgrep, -x, php-fpm]
      register: fpm_process
      changed_when: false
      failed_when: false

    - name: Verify PHP-FPM listener
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ forgeflow_container }}"
          - sh
          - -lc
          - "ss -ltn | grep -Eq '127\\.0\\.0\\.1:9000[[:space:]]'"
      register: fpm_listener
      changed_when: false
      failed_when: false

    - name: Verify application front controller is readable
      ansible.builtin.command:
        argv: [docker, exec, "{{ forgeflow_container }}", test, -r, /var/www/forgeflow/public/index.php]
      register: app_readable
      changed_when: false
      failed_when: false

    - name: Build PHP-FPM health result
      ansible.builtin.set_fact:
        health_check_id: health.php_fpm
        health_component: php-fpm
        health_status: >-
          {{ 'PASS' if fpm_config.rc == 0 and fpm_version.rc == 0 and fpm_process.rc == 0 and fpm_listener.rc == 0 and app_readable.rc == 0 else 'FAIL' }}
        health_message: >-
          {{ 'PHP-FPM configuration, process, listener and application path are healthy.' if fpm_config.rc == 0 and fpm_process.rc == 0 and fpm_listener.rc == 0 and app_readable.rc == 0 else 'One or more PHP-FPM health assertions failed.' }}
        health_details:
          configtest_rc: "{{ fpm_config.rc }}"
          process_running: "{{ fpm_process.rc == 0 }}"
          listener_9000: "{{ fpm_listener.rc == 0 }}"
          app_readable: "{{ app_readable.rc == 0 }}"
          version: "{{ fpm_version.stdout | trim }}"

    - name: Record PHP-FPM health result
      ansible.builtin.include_tasks: tasks/write-health-result.yml
