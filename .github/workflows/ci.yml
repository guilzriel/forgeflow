---
name: Continuous Integration
run-name: >-
  CI · ${{ github.event_name }} · ${{ github.ref_name }}
"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHP quality suite
        run: composer quality

      - name: Validate automation PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find app public scripts -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate automation catalogue
        run: php scripts/automation/validate-catalog.php

  ansible-quality:
    name: Ansible quality
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ansible/ansible.cfg
      ANSIBLE_ROLES_PATH: ansible/roles

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ansible quality tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            "ansible-core>=2.17,<2.19" \
            "ansible-lint>=25,<26" \
            "yamllint>=1.35,<2"

      - name: Install Ansible collections
        run: >-
          ansible-galaxy collection install
          -r ansible/requirements.yml

      - name: Lint YAML
        shell: bash
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' ansible .github/workflows

      - name: Lint Ansible
        run: ansible-lint --profile basic ansible/playbooks

      - name: Run syntax checks for public demo playbooks
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t playbooks < <(
            find ansible/playbooks \
              -maxdepth 1 \
              -type f \
              \( -name 'health-*.yml' -o -name 'collect-*-config.yml' \) \
              -print |
            sort
          )

          if [ "${#playbooks[@]}" -ne 11 ]; then
            echo "Expected 11 public demo playbooks; found ${#playbooks[@]}."
            printf '%s\n' "${playbooks[@]}"
            exit 1
          fi

          for playbook in "${playbooks[@]}"; do
            echo "syntax_check=${playbook}"

            ansible-playbook \
              -i ansible/inventories/demo/hosts.yml \
              "${playbook}" \
              --syntax-check
          done

  container-quality:
    name: Container build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build combined ForgeFlow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          load: true
          push: false
          tags: forgeflow:ci
          build-args: |
            APP_VERSION=ci
            VCS_REF=${{ github.sha }}

      - name: Start combined runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name forgeflow-ci -p 8080:8080 -e FORGEFLOW_VERSION=ci forgeflow:ci
          php scripts/wait-for-health.php --url=http://127.0.0.1:8080/health --timeout=60
          curl --fail --silent http://127.0.0.1:8080/health
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/not-found)"
          test "${status}" = "404"

      - name: Scan combined image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: forgeflow:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy report to GitHub code scanning
        if: >-
          always() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-forgeflow-runtime

      - name: Show runtime logs on failure
        if: ${{ failure() }}
        run: docker logs forgeflow-ci || true

      - name: Stop combined runtime
        if: ${{ always() }}
        run: docker rm -f forgeflow-ci || true
