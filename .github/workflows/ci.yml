name: CI

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find app public -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Run PHP quality checks
        run: composer quality

  ansible-quality:
    name: Ansible quality
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ansible/ansible.cfg
      ANSIBLE_ROLES_PATH: ansible/roles

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python for Ansible tooling
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ansible tooling
        run: |
          python -m pip install \
            "ansible-core>=2.17,<2.19" \
            "ansible-lint>=25,<26" \
            "yamllint>=1.35,<2"

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Lint YAML
        run: yamllint .github ansible compose.yaml .yamllint.yml

      - name: Lint Ansible
        run: ansible-lint ansible
