name: Deploy
run-name: >-
  Deploy · ${{ inputs.environment || github.ref_name }}
'on':
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      image:
        description: Full immutable image reference, including tag
        required: true
        type: string
      execute:
        description: Execute the deployment after planning
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    name: Validate deployment request
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate requested deployment
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_deployment.py \
            --environment "${{ inputs.environment }}" \
            --image "${{ inputs.image }}" | tee deployment-plan.json
          tag="$(python -c 'import json; print(json.load(open("deployment-plan.json"))["tag"])')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload deployment plan
        uses: actions/upload-artifact@v7
        with:
          name: deployment-plan-${{ github.run_id }}
          path: deployment-plan.json
          if-no-files-found: error

      - name: Summarize plan
        run: |
          {
            echo "## Deployment plan"
            echo
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Image: \`${{ inputs.image }}\`"
            echo "- Execute: \`${{ inputs.execute }}\`"
            echo "- Source revision: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: plan
    if: inputs.execute
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: ${{ inputs.environment }}
      image: ${{ inputs.image }}
      source-sha: ${{ github.sha }}
    secrets: inherit
