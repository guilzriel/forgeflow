services:
  forgeflow:
    build:
      context: .
      args:
        APP_VERSION: local
        VCS_REF: development
    image: forgeflow:local
    ports:
      - "8000:8000"
    environment:
      FORGEFLOW_ENVIRONMENT: local
      FORGEFLOW_READY: "true"
      FORGEFLOW_LOG_LEVEL: INFO
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
